# Example: an ESP32 exposing a few entities as the EPICS device LAB:ESP1:XXX.
# Clients: caget LAB:ESP1:XXX
esphome:
  name: epics-node

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
  reboot_timeout: 0s

external_components:
  - source:
      type: local
      path: components
    components: [epics_ca]

sensor:
  - platform: uptime
    id: uptime_s
  - platform: wifi_signal
    id: rssi
    update_interval: 10s

binary_sensor:
  - platform: status
    id: online

text_sensor:
  - platform: version
    id: fw_version

number:
  - platform: template
    id: setpoint
    min_value: 0
    max_value: 100
    step: 0.5
    optimistic: true

switch:
  - platform: template
    id: relay
    optimistic: true

select:
  - platform: template
    id: mode
    options: ["Auto", "Manual", "Off"]
    initial_option: "Auto"
    optimistic: true

text:
  - platform: template
    id: message
    mode: text
    optimistic: true

button:
  - platform: restart
    id: reboot

epics_ca:
  prefix: "LAB:ESP1:"
  max_clients: 4
  beacon_addresses: ["255.255.255.255"]
  pvs:
    - name: UPTIME
      sensor: uptime_s
      units: s
      precision: 0
      archive_deadband: 60
    - name: RSSI
      sensor: rssi
      type: long
      units: dBm
      display_low: -100
      display_high: 0
      low: -80
      lolo: -90
    - name: ONLINE
      binary_sensor: online
      enum_strings: ["Offline", "Online"]
      enum_severities: [MAJOR, NO_ALARM]
    - name: VERSION
      text_sensor: fw_version
    - name: SETPOINT
      number: setpoint
      units: degC
      precision: 1
      on_write:
        - logger.log:
            format: "SETPOINT written: %.2f (%s)"
            args: ["x", "s.c_str()"]
    - name: RELAY
      switch: relay
    - name: MODE
      select: mode
    - name: MESSAGE
      text: message
    - name: REBOOT
      button: reboot
    - name: COUNTER
      id: counter_pv
      type: long
      initial_value: 0
      drive_low: 0
      drive_high: 1000
      high: 900
      hihi: 990

interval:
  - interval: 60s
    then:
      - lambda: |-
          id(counter_pv).set_value(id(counter_pv).get_value() + 1);
