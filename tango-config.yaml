# Example: an ESP32 exposing a few entities as the Tango device esphome/lab/1.
# Clients: tango://<esp-ip>:10000/esphome/lab/1#dbase=no
esphome:
  name: tango-lab

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
  reboot_timeout: 0s

external_components:
  - source:
      type: local
      path: components
    components: [tango]

sensor:
  - platform: internal_temperature
    id: chip_temperature
  - platform: wifi_signal
    id: rssi
    update_interval: 30s

binary_sensor:
  - platform: gpio
    id: door
    pin:
      number: GPIO4
      mode: INPUT_PULLUP

switch:
  - platform: gpio
    id: relay
    pin: GPIO26

number:
  - platform: template
    id: setpoint
    min_value: 5
    max_value: 30
    step: 0.5
    initial_value: 20
    optimistic: true
    unit_of_measurement: "°C"

text_sensor:
  - platform: version
    id: firmware

button:
  - platform: restart
    id: restart_button

tango:
  id: tango_server
  device: esphome/lab/1
  port: 10000
  sensors:
    - id: chip_temperature
      name: ChipTemperature
      description: ESP32 internal temperature
    - id: rssi
      name: WifiSignal
  binary_sensors:
    - id: door
      name: DoorOpen
  switches:
    - id: relay
      name: Relay
      label: Main relay
  numbers:
    - id: setpoint
      name: SetPoint
  text_sensors:
    - id: firmware
      name: Firmware
  buttons:
    - id: restart_button
      name: Restart
      description: Reboot the ESP32
